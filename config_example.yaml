data:
  station: 'UTEC'
  features: ["TEM", "HUM", "VOC"]
  target: "CO2"
  data_path: 'data/air/processed/{station}_processed_features.parquet'
  drop_columns: ['ICA']

preprocessing:
  input_sequence_length: 36
  output_sequence_length: 12
  train_end_timestamp: '2025-07-15 00:00:00'
  val_end_timestamp: '2025-07-31 00:00:00'
  scaler_type: 'standard'  # 'minmax', 'standard', 'robust'

model:
  type: 'BaseLSTM'  # 'BaseLSTM' or 'AttentionLSTM'
  input_size: null  # Will be set to len(features)
  output_size: null  # Will be set to output_sequence_length
  hidden_size: 128
  num_layers: 2
  dropout: 0.2

training:
  batch_size: 32
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 15  # for early stopping
  random_seed: 42
  force_retrain: True
  use_reduce_on_plateau: true
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_min_lr: 0.0000001
  grad_clip_max_norm: 1.0

device:
  use_cuda: false  # Use CUDA if available

logging:
  level: 'INFO'
  name: 'main'

visualization:
  save_plots: true
  plot_dir: 'plots'
  horizons: [1, 3, 9, 12]

mlflow:
  enabled: True

optuna:
  enabled: true
  n_trials: 2
  timeout_seconds: 600
  direction: maximize
  study_name: "co2_{station}_forecast_optimization"
  output_dir: "optuna_results"
  storage: "sqlite:///optuna_results/co2_{station}_forecast_optimization.db"

  search_space:
    model_type:
      type: categorical
      choices: ["BaseLSTM","AttentionLSTM"]
    hidden_size:
      type: categorical
      choices: [32, 64, 96, 128, 256]
    num_layers:
      type: int
      low: 1
      high: 3
    dropout:
      type: float
      low: 0.0
      high: 0.4
    batch_size:
      type: categorical
      choices: [32, 64, 128]
    learning_rate:
      type: float
      low: 0.00001
      high: 0.003
      log: true
    weight_decay:
      type: float
      low: 0.0000001
      high: 0.001
      log: true
    use_reduce_on_plateau:
      type: categorical
      choices: [true, false]
    scheduler_factor:
      type: float
      low: 0.2
      high: 0.7
    scheduler_patience:
      type: int
      low: 2
      high: 6
    early_stopping_patience:
      type: int
      low: 5
      high: 12
    num_epochs:
      type: int
      low: 20
      high: 100
      step: 10
    input_sequence_length:
      type: categorical
      choices: [12, 24, 48, 96, 144]
    output_sequence_length:
      type: categorical
      choices: [1, 6, 12, 24]
    scaler:
      type: categorical
      choices: ["robust", "standard", "minmax"]
    scheduler_min_lr:
      type: float
      low: 0.000000001
      high: 0.000001
      log: true
    grad_clip_max_norm:
      type: float
      low: 0.1
      high: 5.0
      log: true